name: Run browser agent

on:
  # Run manually from the Actions tab, with a goal you type in.
  workflow_dispatch:
    inputs:
      goal:
        description: "What should the agent do?"
        required: true
        default: "Go to wikipedia.org and tell me today's featured article title."

  # Optional: uncomment to also run on a schedule (cron, UTC time).
  # schedule:
  #   - cron: "0 8 * * *"   # every day at 08:00 UTC

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the agent
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          HEADLESS: "true"
        run: node agent.js "${{ github.event.inputs.goal }}"

      - name: Upload result (screenshot + answer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-run-output
          path: run-output/
          if-no-files-found: ignore
